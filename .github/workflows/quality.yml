name: Blog quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: blog-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # 스택의 맨 위 PR에는 아래 PR의 변경이 모두 들어 있으므로 그 PR에서만 검증한다.
  find-upstack:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      has-upstack: ${{ steps.upstack.outputs.has-upstack }}
    steps:
      - id: upstack
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git init --quiet
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --filter=tree:0 origin "+refs/heads/*:refs/remotes/origin/*"

          # 포크 PR처럼 커밋을 찾을 수 없으면 검증을 건너뛰지 않는다.
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "has-upstack=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          upstack=$(git for-each-ref --contains "$HEAD_SHA" --format='%(refname:short)' refs/remotes/origin | grep -vxF "origin/$HEAD_REF" || true)
          echo "$upstack"
          echo "has-upstack=$([ -n "$upstack" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  validate:
    needs: find-upstack
    # find-upstack이 건너뛰어지거나 실패해도 검증은 돌린다.
    if: ${{ !cancelled() && needs.find-upstack.outputs.has-upstack != 'true' }}
    runs-on: ubuntu-latest
    env:
      PUBLIC_GA_ID: G-TEST000000
      EXPECT_ANALYTICS: "on"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - name: Verify preview excludes monitoring
        run: |
          VERCEL_ENV=preview bun run build
          VERCEL_ENV=preview EXPECT_ANALYTICS=off bun run verify:site
