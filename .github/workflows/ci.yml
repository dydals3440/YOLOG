name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PUBLIC_GA_ID: G-TEST000000
      EXPECT_ANALYTICS: "on"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun ci
      - run: bun audit --audit-level=high
      - run: bun run check
      - run: bun run test

      # 콘텐츠 이미지가 바뀌지 않으면 이전 빌드의 이미지 최적화 결과를 재사용한다.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('src/content/**/*.webp', 'src/content/**/*.png', 'src/content/**/*.jpg', 'src/content/**/*.gif', 'src/content/**/*.svg') }}
          restore-keys: astro-${{ runner.os }}-

      - run: bun run build
      - run: bun run test:site

      - name: Lighthouse
        if: github.event_name == 'pull_request'
        run: bun run lighthouse
